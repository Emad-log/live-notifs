<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Live Activity</title>
  <link rel="stylesheet" href="styles.css?v=minimal1">
</head>
<body>
  <main class="canvas" aria-label="Animated Apple-style live activity">
    <div class="dynamic-island"><span class="island-dot"></span><span id="islandText">UA 837</span></div>
    <article class="activity" id="activity">
      <div class="activity-head"><div class="app-icon">✦</div><div class="app-name">Live Activity</div><div class="updated" id="updated">now</div></div>
      <div class="content"><div class="eyebrow" id="eyebrow">FLIGHT STATUS</div><h1 id="title">UA 837 is on time</h1><p id="copy">Boarding begins at 8:55 PM · Gate B12</p><div class="route"><span>JFK</span><span class="route-line"></span><span>YYZ</span></div><div class="details"><span id="detailLabel">Gate B12</span><strong id="detailValue">On schedule</strong></div></div>
      <div class="actions" id="actions"></div>
    </article>
    <div class="tap" id="tap"><span></span></div>
  </main>
  <script src="app.js?v=minimal1"></script>
</body>
</html>
